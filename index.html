<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoalHub — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="home.css">
</head>
<body>

<div class="app-frame">
  <div class="scroll-area">

    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <div class="brand-mark">G</div>
          <span class="brand-name">GoalHub</span>
        </div>
        <button class="bell-btn" aria-label="Notifications">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
      </div>
      <h1 class="greeting">Good afternoon</h1>
      <p class="greeting-sub" id="dateLine">Saturday, matchday across Europe</p>
    </header>

    <nav class="league-tabs" id="leagueTabs">
      <button class="chip active" data-league="all">All leagues</button>
      <button class="chip" data-league="PL">Premier League</button>
      <button class="chip" data-league="LL">La Liga</button>
      <button class="chip" data-league="SA">Serie A</button>
    </nav>

    <main>
      <section aria-labelledby="today-h">
        <div class="section-head">
          <h2 id="today-h">Today's matches</h2>
          <span class="section-sub">Live &amp; kickoff times</span>
        </div>
        <div class="match-carousel" id="todayMatches"></div>
      </section>

      <section aria-labelledby="predict-h">
        <div class="predict-card">
          <div class="predict-head">
            <h2 id="predict-h">Predict the match</h2>
            <div class="points-pill">🏆 <span id="pointsValue">120</span> pts</div>
          </div>
          <p class="predict-sub">Call the result before kickoff. Get it right, earn 10 points.</p>
          <div class="predict-match" id="predictMatch"></div>
          <div class="predict-options" id="predictOptions"></div>
          <p class="predict-status" id="predictStatus">Pick a result to lock your prediction.</p>
        </div>
      </section>

      <section aria-labelledby="upcoming-h">
        <div class="section-head">
          <h2 id="upcoming-h">Upcoming fixtures</h2>
        </div>
        <div class="fixture-list" id="upcomingList"></div>
      </section>

      <section aria-labelledby="results-h">
        <div class="section-head">
          <h2 id="results-h">Recent results</h2>
        </div>
        <div class="fixture-list" id="resultsList"></div>
      </section>
    </main>
  </div>

  <div class="empty-note" id="emptyNote"></div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
      Home
    </button>
    <button class="nav-item" data-tab="leagues">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M6 4h12v4a6 6 0 0 1-12 0V4z"/><path d="M6 6H4a2 2 0 0 0 2 4"/><path d="M18 6h2a2 2 0 0 1-2 4"/></svg>
      Leagues
    </button>
    <button class="nav-item" data-tab="teams">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.2 8-7 10-3.8-2-7-5-7-10V6l7-3z"/></svg>
      Teams
    </button>
    <button class="nav-item" data-tab="matches">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>
      Matches
    </button>
  </nav>
</div>

<script src="home.js"></script>
</body>
</html>
